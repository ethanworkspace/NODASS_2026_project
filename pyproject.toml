[project]
name = "nodass-coastal-source-tracing-ai"
version = "0.1.0"
description = "海岸生態壓力與污染來源追蹤 AI 專案。"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "scikit-learn>=1.3",
  "pydantic>=2.0",
  "typer>=0.9",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
models = [
  "pgmpy>=0.1.25",
  "dowhy>=0.11",
  "statsmodels>=0.14"
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "folium>=0.15"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]

[tool.ruff]
line-length = 100
target-version = "py310"
