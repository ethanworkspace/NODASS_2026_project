<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NODASS 海岸污染來源追蹤 AI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #f4f7f8; --panel: #fff; --ink: #17252b; --muted: #62737b;
      --line: #d8e1e5; --nav: #10353d; --nav2: #1f525c; --teal: #006d77;
      --cyan: #2a9d8f; --blue: #386fa4; --gold: #d99a1e; --red: #c84c4c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; letter-spacing: 0; font-size: 16px; line-height: 1.55; }
    button, input, select { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    aside { background: var(--nav); color: #f7fcfd; padding: 24px 18px; position: sticky; top: 0; height: 100vh; }
    .brand { font-size: 20px; font-weight: 800; line-height: 1.35; margin-bottom: 22px; }
    .nav-button { width: 100%; border: 0; color: #d6e8eb; background: transparent; border-radius: 8px; padding: 11px 12px; margin-bottom: 7px; text-align: left; cursor: pointer; }
    .nav-button.active, .nav-button:hover { color: white; background: var(--nav2); }
    main { padding: 28px; min-width: 0; }
    .topbar { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.25; } h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.3; } h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.35; }
    .muted { color: var(--muted); line-height: 1.6; margin: 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 10px 13px; font-weight: 700; cursor: pointer; }
    .btn.primary { background: var(--teal); color: white; border-color: var(--teal); }
    .stats { display: grid; grid-template-columns: repeat(6, minmax(135px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .label { color: var(--muted); font-size: 14px; margin-bottom: 7px; } .value { font-size: 26px; font-weight: 800; }
    .toolbar { display: grid; grid-template-columns: 1fr 170px 170px; gap: 10px; margin-bottom: 14px; }
    input, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; background: white; color: var(--ink); }
    .grid { display: grid; grid-template-columns: 1.35fr .9fr; gap: 16px; align-items: start; } .full { grid-column: 1 / -1; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; vertical-align: top; }
    th:first-child, td:first-child { text-align: left; } th { color: var(--muted); background: #f8fafb; font-weight: 700; }
    tr.clickable { cursor: pointer; } tr.clickable:hover, tr.selected { background: #eef7f8; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; padding: 4px 9px; border-radius: 999px; background: var(--teal); color: white; font-size: 12px; font-weight: 700; }
    .badge.high { background: var(--red); } .badge.mid { background: var(--gold); } .badge.low { background: var(--blue); }
    .summary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .metric { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcfc; }
    .metric strong { display: block; font-size: 17px; margin-top: 4px; }
    .bars { display: grid; gap: 11px; } .bar-row { display: grid; grid-template-columns: 130px 1fr 56px; gap: 10px; align-items: center; }
    .track { height: 10px; border-radius: 999px; background: #e7edf0; overflow: hidden; } .fill { height: 100%; border-radius: inherit; background: var(--cyan); }
    .map { min-height: 300px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(90deg, rgba(56,111,164,.12) 1px, transparent 1px), linear-gradient(rgba(56,111,164,.12) 1px, transparent 1px), #edf7f8; background-size: 34px 34px; position: relative; overflow: hidden; }
    .wide-map { height: min(68vh, 620px); min-height: 440px; padding: 0; background: #eaf6f8; }
    .wide-map svg { width: 100%; height: 100%; display: block; }
    .map-shell { display: grid; gap: 10px; }
    .leaflet-map { height: min(68vh, 620px); min-height: 460px; width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #eaf6f8; }
    .map-tools { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
    .map-legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
    .legend-dot.event { background: var(--red); }
    .legend-dot.source { background: var(--gold); }
    .legend-line { width: 22px; height: 3px; background: var(--cyan); display: inline-block; border-radius: 999px; }
    .leaflet-control-layers, .leaflet-popup-content { font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; }
    .map-label { font-size: 12px; fill: #24434b; font-weight: 700; }
    .map-small { font-size: 11px; fill: #5b7178; }
    .map-point { cursor: pointer; transition: r .15s ease; }
    .map-point:hover { r: 6; }
    .coast { position: absolute; left: 40px; top: -26px; width: 150px; height: 360px; background: #d9e8d2; border-right: 4px solid #7ba47d; transform: rotate(10deg); }
    .dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .dot.event { left: 47%; top: 55%; background: var(--red); } .dot.source { background: var(--gold); }
    .dot.s0 { left: 36%; top: 42%; } .dot.s1 { left: 29%; top: 59%; } .dot.s2 { left: 58%; top: 37%; }
    .vector { position: absolute; left: 49%; top: 47%; width: 112px; height: 3px; background: var(--cyan); transform-origin: left center; }
    .vector:after { content: ""; position: absolute; right: -1px; top: -5px; border-left: 11px solid var(--cyan); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .note { background: #fff7e5; border: 1px solid #ecd49b; color: #6f520a; border-radius: 8px; padding: 12px; line-height: 1.6; }
    .source-list, .api-grid { display: grid; gap: 12px; } .api-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .source-card, .api-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: #fbfcfc; line-height: 1.65; }
    .source-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .progress { height: 9px; border-radius: 999px; background: #e7edf0; overflow: hidden; margin-top: 10px; } .progress span { display: block; height: 100%; background: var(--teal); }
    .evidence-grid { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
    .evidence-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fff; }
    .evidence-item strong { display: block; font-size: 16px; margin-bottom: 6px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: #fff; color: var(--muted); font-size: 14px; }
    .mini-map { min-height: 260px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #eaf6f8; }
    .api-link-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .priority-list { display: grid; gap: 10px; }
    .priority-card { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfcfc; }
    .priority-rank { width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; background: var(--teal); color: #fff; font-weight: 800; }
    .layer-panel { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfc; }
    .layer-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .select-inline { width: auto; min-width: 230px; }
    .probability-bar { display: grid; grid-template-columns: 170px 1fr 70px; gap: 10px; align-items: center; margin-top: 8px; }
    .probability-track { height: 13px; border-radius: 999px; overflow: hidden; background: #e7edf0; }
    .probability-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--gold)); }
    .timeline { display: grid; gap: 10px; }
    .timeline-row { display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: start; }
    .timeline-hour { font-weight: 800; color: var(--teal); }
    .loading { padding: 32px; text-align: center; color: var(--muted); }
    @media (max-width: 1080px) { .app, .grid, .stats, .api-grid, .api-link-grid, .toolbar, .evidence-grid { grid-template-columns: 1fr; } aside { position: static; height: auto; } .topbar { display: grid; } .actions { justify-content: flex-start; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const pollutantLabels = { suspended_solid: "懸浮固體", chlorophyll_a: "葉綠素 a", ammonia_nitrogen: "氨氮", nitrate_nitrogen: "硝酸鹽氮", orthophosphate: "正磷酸鹽", nitrite_nitrogen: "亞硝酸鹽氮", silicate: "矽酸鹽", zinc: "鋅", copper: "銅", lead: "鉛", cadmium: "鎘", chromium: "鉻", mercury: "汞" };
    const groupLabels = { suspended_solids: "懸浮固體", chlorophyll: "葉綠素", nutrients: "營養鹽", heavy_metals: "重金屬" };
    const sourceTypeLabels = { river: "河川輸入", harbor: "港區活動", industrial: "工業來源", wastewater_treatment: "污水處理", official_discharge: "環境部放流口", coastal_station: "海岸測站" };
    const mapProvider = {
      name: "OpenStreetMap",
      tileUrl: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      attribution: "&copy; OpenStreetMap contributors"
    };
    function number(value, digits = 0) { if (value === null || value === undefined || value === "") return "無資料"; return Number(value).toLocaleString("zh-TW", { maximumFractionDigits: digits }); }
    function confidenceClass(level) { if (level === "高") return "badge high"; if (level === "中") return "badge mid"; return "badge low"; }
    function loadSystemData() { return fetch("./data/system_data.json").then((res) => res.ok ? res.json() : Promise.reject()).catch(() => fetch("./system_data.json").then((res) => res.json())); }
    function formatDate(date) { return date.toISOString().slice(0, 10); }
    function eventDateWindow(event, days = 3) {
      const base = new Date((event?.detected_at || "").replace(" ", "T"));
      if (Number.isNaN(base.getTime())) return { start: "無資料", end: "無資料" };
      const start = new Date(base); start.setDate(start.getDate() - days);
      const end = new Date(base); end.setDate(end.getDate() + days);
      return { start: formatDate(start), end: formatDate(end) };
    }
    function imageCodesForEvent(event) {
      if (event?.pollutant_group === "chlorophyll") return ["GOCI_CHL", "OLNT_S3_CHL", "Sentinel2_CHL", "GOCI"];
      if (event?.pollutant_group === "suspended_solids") return ["GOCI_TSS", "OLNT_S3_TSM", "Sentinel2_TSM", "GOCI", "OLNT_S3"];
      if (event?.pollutant_group === "nutrients") return ["GOCI_CHL", "OLNT_S3_CHL", "SLNT_S3_SST", "GOCI"];
      if (event?.pollutant_group === "heavy_metals") return ["GOCI_TSS", "OLNT_S3_TSM", "Sentinel2_TSM", "OLNT_S3"];
      return ["GOCI", "OLNT_S3", "SLNT_S3_SST"];
    }
    function nodassUrl(code, start, end) {
      const path = code === "GOCI" || code === "OLNT_S3" ? "tiles" : "images";
      return `https://nodass.namr.gov.tw/noapi/namr/v1/${path}/${code}?date1=${start}&date2=${end}`;
    }
    function imageUrl(code, start, end) {
      return `https://nodass.namr.gov.tw/noapi/namr/v1/images/${code}?date1=${start}&date2=${end}`;
    }
    function tileTemplate(accessUrl) {
      if (!accessUrl) return null;
      return `${String(accessUrl).replace(/\/?$/, "/")}{z}/{y}/{x}.jpg`;
    }
    function destinationPoint(lat, lon, bearingDeg, distanceKm) {
      const radius = 6371;
      const brng = bearingDeg * Math.PI / 180;
      const lat1 = Number(lat) * Math.PI / 180;
      const lon1 = Number(lon) * Math.PI / 180;
      const angular = distanceKm / radius;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(angular) + Math.cos(lat1) * Math.sin(angular) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(angular) * Math.cos(lat1), Math.cos(angular) - Math.sin(lat1) * Math.sin(lat2));
      return { lat: lat2 * 180 / Math.PI, lon: lon2 * 180 / Math.PI };
    }
    function reverseDriftTrack(event, window, hours = 72) {
      if (!event || !window) return [];
      const speed = Number(window.mean_current_speed || 0);
      const bearing = (Number(window.dominant_current_direction || 0) + 180) % 360;
      const points = [];
      for (let hour = 0; hour <= hours; hour += 12) {
        const distanceKm = speed * hour * 3.6;
        const point = destinationPoint(event.lat, event.lon, bearing, distanceKm);
        points.push({ hour, distanceKm, ...point });
      }
      return points;
    }
    function bayesianRows(rankings) {
      const priors = { river: 1.15, official_discharge: 1.1, wastewater_treatment: 1.08, harbor: 1.0, industrial: 1.05, coastal_station: 0.85 };
      const weighted = rankings.map((row) => {
        const prior = priors[row.source_type] || 1;
        const likelihood = Math.max(0.01, Number(row.source_score || 0)) * prior;
        return { ...row, prior, likelihood };
      });
      const total = weighted.reduce((sum, row) => sum + row.likelihood, 0) || 1;
      return weighted.map((row) => ({ ...row, posterior: row.likelihood / total })).sort((a, b) => b.posterior - a.posterior);
    }
    function makeSamplingPlan(event, rankings, sources) {
      if (!event) return [];
      const rankedIds = new Set(rankings.map((row) => row.source_id));
      const sourceById = new Map(sources.map((source) => [source.source_id, source]));
      const rows = rankings.slice(0, 3).map((rank, index) => {
        const source = sourceById.get(rank.source_id);
        const ratio = [0.35, 0.5, 0.7][index] || 0.5;
        const hasPoint = source && Number(source.lat) && Number(source.lon);
        return {
          name: hasPoint ? `${rank.source_name} 至 ${event.station_name} 斷面 ${Math.round(ratio * 100)}%` : `${rank.source_name} 鄰近海域`,
          reason: `驗證第 ${index + 1} 候選來源；信心 ${rank.confidence_level || "無資料"}，距離 ${number(rank.distance_km, 2)} km。`,
          lat: hasPoint ? Number(source.lat) + (Number(event.lat) - Number(source.lat)) * ratio : Number(event.lat),
          lon: hasPoint ? Number(source.lon) + (Number(event.lon) - Number(source.lon)) * ratio : Number(event.lon),
          rank: index + 1
        };
      });
      rows.unshift({ name: `${event.station_name} 複測點`, reason: "先確認異常是否仍存在，作為來源反推的校正點。", lat: Number(event.lat), lon: Number(event.lon), rank: 0 });
      return rows.filter((row) => Number(row.lat) && Number(row.lon));
    }

    function App() {
      const [data, setData] = useState(null);
      const [activeTab, setActiveTab] = useState("總覽");
      const [query, setQuery] = useState("");
      const [group, setGroup] = useState("全部");
      const [confidence, setConfidence] = useState("全部");
      const [selectedId, setSelectedId] = useState(null);
      useEffect(() => { loadSystemData().then((payload) => { setData(payload); setSelectedId(payload.events?.[0]?.event_id || null); }); }, []);
      const events = data?.events || [], rankings = data?.rankings || [], windows = data?.windows || [], sources = data?.sources || [];
      const selectedEvent = events.find((event) => event.event_id === selectedId) || events[0];
      const selectedRankings = rankings.filter((row) => row.event_id === selectedEvent?.event_id);
      const selectedWindow = windows.find((row) => row.event_id === selectedEvent?.event_id);
      const filteredEvents = useMemo(() => events.filter((event) => {
        const text = `${event.event_id} ${event.station_name} ${event.pollutant_name}`.toLowerCase();
        const matchQuery = !query || text.includes(query.toLowerCase());
        const matchGroup = group === "全部" || event.pollutant_group === group;
        const eventRanks = rankings.filter((row) => row.event_id === event.event_id);
        const matchConfidence = confidence === "全部" || eventRanks.some((row) => row.confidence_level === confidence);
        return matchQuery && matchGroup && matchConfidence;
      }), [events, rankings, query, group, confidence]);
      const sourceTypeCounts = useMemo(() => sources.reduce((acc, source) => { acc[source.source_type] = (acc[source.source_type] || 0) + 1; return acc; }, {}), [sources]);
      const imageApiCount = (data?.nodass_api_probe?.results || []).filter((row) => row.url?.includes("/images/") || row.url?.includes("/tiles/")).length;
      if (!data) return <div className="loading">正在載入 NODASS 系統資料...</div>;
      const tabs = ["總覽", "異常事件", "來源追蹤", "影像佐證", "漂流反推", "貝氏機率", "採樣建議", "時空一致性", "模型評估", "NODASS 探測", "離岸風電水質"];
      return (
        <div className="app">
          <aside>
            <div className="brand">NODASS<br />污染來源追蹤 AI</div>
            {tabs.map((tab) => <button key={tab} className={`nav-button ${activeTab === tab ? "active" : ""}`} onClick={() => setActiveTab(tab)}>{tab}</button>)}
          </aside>
          <main>
            <div className="topbar">
              <div><h1>海岸生態壓力與污染傳輸來源追蹤</h1><p className="muted">系統已載入水質異常、72 小時事件窗、NODASS API 探測與離岸風電水質摘要，可直接查看來源推估依據。</p></div>
              <div className="actions"><button className="btn" onClick={() => setActiveTab("NODASS 探測")}>查看 NODASS API</button><button className="btn" onClick={() => setActiveTab("時空一致性")}>檢視時空規則</button><button className="btn primary" onClick={() => setActiveTab("異常事件")}>瀏覽事件</button></div>
            </div>
            <div className="stats">
              <div className="card"><div className="label">異常事件</div><div className="value">{number(events.length)}</div></div>
              <div className="card"><div className="label">候選來源</div><div className="value">{number(sources.length)}</div></div>
              <div className="card"><div className="label">來源排序</div><div className="value">{number(rankings.length)}</div></div>
              <div className="card"><div className="label">雨量站</div><div className="value">{number(data.rainfall_station_count)}</div></div>
              <div className="card"><div className="label">環境部放流口</div><div className="value">{number(data.official_discharge_source_count || 0)}</div></div>
              <div className="card"><div className="label">影像 API</div><div className="value">{number(imageApiCount)}</div></div>
            </div>
            {activeTab === "總覽" && <Overview events={events} sourceTypeCounts={sourceTypeCounts} sources={sources} selectedEvent={selectedEvent} setSelectedId={setSelectedId} window={selectedWindow} rankings={selectedRankings} />}
            {activeTab === "異常事件" && <Events events={filteredEvents} selectedEvent={selectedEvent} setSelectedId={setSelectedId} query={query} setQuery={setQuery} group={group} setGroup={setGroup} confidence={confidence} setConfidence={setConfidence} />}
            {activeTab === "來源追蹤" && <Tracing event={selectedEvent} rankings={selectedRankings} window={selectedWindow} sources={sources} />}
            {activeTab === "影像佐證" && <ImageEvidence event={selectedEvent} probe={data.nodass_api_probe || {}} />}
            {activeTab === "漂流反推" && <ReverseDrift event={selectedEvent} window={selectedWindow} rankings={selectedRankings} sources={sources} />}
            {activeTab === "貝氏機率" && <BayesianProbability event={selectedEvent} rankings={selectedRankings} />}
            {activeTab === "採樣建議" && <SamplingPlanner event={selectedEvent} rankings={selectedRankings} sources={sources} />}
            {activeTab === "時空一致性" && <Consistency window={selectedWindow} />}
            {activeTab === "模型評估" && <MethodAssessment methods={data.method_evaluation || []} apis={data.nodass_api_requirements || []} />}
            {activeTab === "NODASS 探測" && <NodassProbe probe={data.nodass_api_probe || {}} />}
            {activeTab === "離岸風電水質" && <OffshoreWindQuality summary={data.offshore_wind_quality || {}} />}
          </main>
        </div>
      );
    }

    function Overview({ events, sourceTypeCounts, sources, selectedEvent, setSelectedId, window, rankings }) {
      return <div className="grid">
        <section><h2>最高風險事件</h2><EventTable events={events.slice(0, 8)} selectedEvent={selectedEvent} setSelectedId={setSelectedId} /></section>
        <section><h2>來源類型分布</h2><div className="bars">{Object.entries(sourceTypeCounts).map(([type, count]) => <div className="bar-row" key={type}><span>{sourceTypeLabels[type] || type}</span><div className="track"><div className="fill" style={{ width: `${Math.max(8, count / sources.length * 100)}%` }}></div></div><span>{count}</span></div>)}</div></section>
        <section className="full"><h2>目前選取事件</h2><EventDetail event={selectedEvent} window={window} rankings={rankings} /></section>
      </div>;
    }

    function EventTable({ events, selectedEvent, setSelectedId }) {
      return <div className="table-wrap"><table><thead><tr><th>事件</th><th>測站</th><th>時間</th><th>污染物</th><th>實測值</th><th>異常分數</th></tr></thead><tbody>{events.map((event) => <tr key={event.event_id} className={`clickable ${selectedEvent?.event_id === event.event_id ? "selected" : ""}`} onClick={() => setSelectedId(event.event_id)}><td>{event.event_id}</td><td>{event.station_name}</td><td>{event.detected_at}</td><td>{pollutantLabels[event.pollutant_name] || event.pollutant_name}</td><td>{number(event.observed_value, 2)}</td><td>{number(event.anomaly_score, 2)}</td></tr>)}</tbody></table></div>;
    }

    function Events({ events, selectedEvent, setSelectedId, query, setQuery, group, setGroup, confidence, setConfidence }) {
      return <section><h2>異常事件查詢</h2><div className="toolbar"><input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="搜尋事件、測站或污染物" /><select value={group} onChange={(event) => setGroup(event.target.value)}><option>全部</option>{Object.keys(groupLabels).map((key) => <option value={key} key={key}>{groupLabels[key]}</option>)}</select><select value={confidence} onChange={(event) => setConfidence(event.target.value)}><option>全部</option><option>高</option><option>中</option><option>低</option></select></div><div className="table-wrap"><table><thead><tr><th>事件</th><th>測站</th><th>污染群組</th><th>污染物</th><th>時間</th><th>實測值</th><th>基準值</th><th>異常分數</th></tr></thead><tbody>{events.map((event) => <tr key={event.event_id} className={`clickable ${selectedEvent?.event_id === event.event_id ? "selected" : ""}`} onClick={() => setSelectedId(event.event_id)}><td>{event.event_id}</td><td>{event.station_name}</td><td>{groupLabels[event.pollutant_group] || event.pollutant_group}</td><td>{pollutantLabels[event.pollutant_name] || event.pollutant_name}</td><td>{event.detected_at}</td><td>{number(event.observed_value, 2)}</td><td>{number(event.baseline_value, 2)}</td><td>{number(event.anomaly_score, 2)}</td></tr>)}</tbody></table></div></section>;
    }

    function EventDetail({ event, window, rankings }) {
      if (!event) return <p className="muted">尚無事件資料。</p>;
      const top = rankings[0];
      return <div className="summary-grid"><div className="metric"><span className="label">異常測站</span><strong>{event.station_name}</strong></div><div className="metric"><span className="label">污染物</span><strong>{pollutantLabels[event.pollutant_name] || event.pollutant_name}</strong></div><div className="metric"><span className="label">最高候選來源</span><strong>{top?.source_name || "無符合來源"}</strong></div><div className="metric"><span className="label">來源信心</span><strong>{top?.confidence_level || "無資料"}</strong></div><div className="metric"><span className="label">72 小時海氣象資料</span><strong>{number(window?.meteo_rows)} 筆</strong></div><div className="metric"><span className="label">雨量狀態</span><strong>{window?.rain_status || "無資料"}</strong></div></div>;
    }

    function Tracing({ event, rankings, window, sources }) {
      return <div className="grid"><section><h2>候選來源排序</h2><p className="muted">目前事件：{event?.event_id}，{event?.station_name}</p><div className="source-list">{rankings.map((row, index) => <div className="source-card" key={`${row.event_id}-${row.source_id}`}><div className="source-head"><strong>{index + 1}. {row.source_name}</strong><span className={confidenceClass(row.confidence_level)}>{row.confidence_level}信心</span></div><p className="muted">類型：{sourceTypeLabels[row.source_type] || row.source_type}，距離：{row.distance_km} km，72 小時可達：{row.reachable_within_72h ? "是" : "否"}</p><div className="progress"><span style={{ width: `${Math.min(100, row.source_score * 100)}%` }}></span></div></div>)}</div></section><section><h2>追蹤判斷</h2><div className="summary-grid"><div className="metric"><span className="label">主導流向</span><strong>{number(window?.dominant_current_direction, 1)}°</strong></div><div className="metric"><span className="label">主導風向</span><strong>{number(window?.dominant_wind_direction, 1)}°</strong></div><div className="metric"><span className="label">平均流速</span><strong>{number(window?.mean_current_speed, 3)} m/s</strong></div><div className="metric"><span className="label">事件窗資料</span><strong>{number(window?.meteo_rows)} 筆</strong></div></div><div className="note" style={{ marginTop: 12 }}>排序前會先套用 72 小時時空一致性，只保留可由上游流向、上風或可達距離支持的候選來源。</div></section><section className="full"><h2>互動地圖</h2><ConnectedMap event={event} rankings={rankings} sources={sources} window={window} /></section><section className="full"><h2>來源證據拆解</h2><EvidencePanel rankings={rankings} /></section></div>;
    }

    function EvidencePanel({ rankings }) {
      if (!rankings.length) return <p className="muted">尚無來源排序資料。</p>;
      return <div className="source-list">{rankings.slice(0, 5).map((row, index) => <div className="source-card" key={`evidence-${row.event_id}-${row.source_id}`}><div className="source-head"><strong>{index + 1}. {row.source_name}</strong><span className={confidenceClass(row.confidence_level)}>{row.confidence_level}信心</span></div><div className="evidence-grid"><div className="evidence-item"><strong>{number(row.source_score * 100, 1)}%</strong><span className="muted">綜合來源分數</span></div><div className="evidence-item"><strong>{number(row.upstream_current_score * 100, 1)}%</strong><span className="muted">上游流向吻合</span></div><div className="evidence-item"><strong>{number(row.upwind_score * 100, 1)}%</strong><span className="muted">上風方向吻合</span></div><div className="evidence-item"><strong>{number(row.pollutant_match_score * 100, 1)}%</strong><span className="muted">污染物型態吻合</span></div></div><div className="pill-row" style={{ marginTop: 10 }}><span className="pill">距離 {number(row.distance_km, 2)} km</span><span className="pill">方位 {number(row.bearing_to_event, 1)}°</span><span className="pill">72 小時可達：{row.reachable_within_72h ? "是" : "否"}</span></div><p className="muted" style={{ marginTop: 10 }}>{row.explanation || "此候選來源已通過時空一致性篩選。"}</p></div>)}</div>;
    }

    function ImageEvidence({ event, probe }) {
      const period = eventDateWindow(event);
      const probeRows = probe.results || [];
      const availableCodes = new Set(probeRows.filter((row) => row.url?.includes("/images/") || row.url?.includes("/tiles/")).map((row) => row.code));
      const rows = [...imageCodesForEvent(event), "GOCI_SSH"].filter((code, index, arr) => arr.indexOf(code) === index).map((code) => {
        const samples = probeRows.filter((row) => row.code === code);
        return { code, url: code === "GOCI_SSH" ? imageUrl(code, period.start, period.end) : nodassUrl(code, period.start, period.end), sampleCount: samples.reduce((sum, row) => sum + Number(row.record_count || 0), 0), known: availableCodes.has(code), keys: samples[0]?.sample_keys || [] };
      });
      return <div className="grid"><section><h2>事件窗影像佐證</h2><p className="muted">目前事件：{event?.event_id}，{event?.station_name}</p><div className="summary-grid" style={{ marginTop: 12 }}><div className="metric"><span className="label">事件日期</span><strong>{event?.detected_at || "無資料"}</strong></div><div className="metric"><span className="label">影像查詢窗</span><strong>{period.start} ~ {period.end}</strong></div><div className="metric"><span className="label">污染群組</span><strong>{groupLabels[event?.pollutant_group] || event?.pollutant_group || "無資料"}</strong></div><div className="metric"><span className="label">優先影像類型</span><strong>{rows.map((row) => row.code).join("、")}</strong></div></div><div className="note" style={{ marginTop: 12 }}>這裡依事件污染物自動推薦 NODASS 影像端點；GOCI 與 OLNT_S3 圖磚已整合到來源追蹤地圖的疊圖選單。</div></section><section><h2>判讀重點</h2><div className="priority-list"><div className="priority-card"><div className="priority-rank">1</div><div><h3>同日或前後 72 小時</h3><p className="muted">只採用事件窗內影像，避免把不同水文條件混在一起。</p></div></div><div className="priority-card"><div className="priority-rank">2</div><div><h3>測站上游/上風方向</h3><p className="muted">優先查看來源到事件測站之間是否有濁水、葉綠素或水團邊界。</p></div></div><div className="priority-card"><div className="priority-rank">3</div><div><h3>雲遮與缺值</h3><p className="muted">若自然色圖磚雲遮嚴重，該影像不可作為主要來源證據。</p></div></div></div></section><section className="full"><h2>NODASS 影像/API 入口</h2><div className="api-link-grid">{rows.map((row) => <div className="api-card" key={row.code}><div className="source-head"><h3>{row.code}</h3><span className={row.known ? "badge" : "badge low"}>{row.known ? "已探測" : "待確認"}</span></div><p className="muted">探測樣本筆數：{number(row.sampleCount)}；回傳欄位：{row.keys.slice(0, 5).join("、") || (row.code === "GOCI_SSH" ? "目前探測為 404，需確認代碼或資料狀態" : "尚無樣本")}</p><a className="btn" href={row.url} target="_blank" rel="noreferrer">開啟事件窗 API</a></div>)}</div></section><section className="full"><h2>Earth Engine 入口</h2><div className="api-card"><h3>Google Earth Engine API</h3><p className="muted">可作為後續 Sentinel-2/3 自動取像、雲遮遮罩、水色指標與事件窗影像比對的正式處理平台。目前系統先列為待申請/待串接項目，不把金鑰放入前端。</p><a className="btn" href="https://earthengine.googleapis.com" target="_blank" rel="noreferrer">查看 API 入口</a></div></section></div>;
    }

    function ReverseDrift({ event, window, rankings, sources }) {
      const track = reverseDriftTrack(event, window);
      const distance72 = track.at(-1)?.distanceKm || 0;
      return <div className="grid"><section><h2>72 小時反向漂流</h2><p className="muted">目前事件：{event?.event_id}，{event?.station_name}</p><div className="summary-grid" style={{ marginTop: 12 }}><div className="metric"><span className="label">反推方向</span><strong>{number((Number(window?.dominant_current_direction || 0) + 180) % 360, 1)}°</strong></div><div className="metric"><span className="label">平均流速</span><strong>{number(window?.mean_current_speed, 3)} m/s</strong></div><div className="metric"><span className="label">72 小時距離</span><strong>{number(distance72, 2)} km</strong></div><div className="metric"><span className="label">事件窗資料</span><strong>{number(window?.meteo_rows)} 筆</strong></div></div><div className="note" style={{ marginTop: 12 }}>這是 OpenDrift/OceanParcels 前的簡化雛形：用事件窗平均流速與主導流向反推 72 小時可能來源路徑，正式版需接入格網海流。</div></section><section><h2>軌跡節點</h2><div className="timeline">{track.map((row) => <div className="timeline-row" key={row.hour}><div className="timeline-hour">-{row.hour} 小時</div><div><strong>{number(row.distanceKm, 2)} km</strong><p className="muted">緯度 {number(row.lat, 5)}，經度 {number(row.lon, 5)}</p></div></div>)}</div></section><section className="full"><h2>反推地圖</h2><DriftMap event={event} track={track} rankings={rankings} sources={sources} /></section></div>;
    }

    function DriftMap({ event, track, rankings, sources }) {
      const mapNode = useRef(null);
      const mapInstance = useRef(null);
      const hasLeaflet = Boolean(globalThis.L);
      useEffect(() => {
        if (!mapNode.current || !hasLeaflet || !event || !track.length) return;
        const L = globalThis.L;
        if (mapInstance.current) mapInstance.current.remove();
        const map = L.map(mapNode.current, { scrollWheelZoom: true, zoomControl: true }).setView([Number(event.lat), Number(event.lon)], 8);
        mapInstance.current = map;
        L.tileLayer(mapProvider.tileUrl, { maxZoom: 19, attribution: mapProvider.attribution }).addTo(map);
        const latLngs = track.map((row) => [row.lat, row.lon]);
        L.polyline(latLngs, { color: "#7b4ab8", weight: 4, opacity: 0.76, dashArray: "8 8" }).addTo(map);
        track.forEach((row) => L.circleMarker([row.lat, row.lon], { radius: row.hour === 0 ? 8 : 5, color: "#fff", weight: 2, fillColor: row.hour === 0 ? "#c84c4c" : "#7b4ab8", fillOpacity: 0.92 }).bindPopup(`<strong>反推 ${row.hour} 小時</strong><br>${number(row.distanceKm, 2)} km`).addTo(map));
        const sourceById = new Map(sources.map((source) => [source.source_id, source]));
        rankings.slice(0, 5).forEach((rank) => {
          const source = sourceById.get(rank.source_id);
          if (source && Number(source.lat) && Number(source.lon)) L.circleMarker([Number(source.lat), Number(source.lon)], { radius: 6, color: "#fff", weight: 2, fillColor: "#d99a1e", fillOpacity: 0.9 }).bindPopup(`<strong>${rank.source_name}</strong><br>後選來源，距離 ${number(rank.distance_km, 2)} km`).addTo(map);
        });
        map.fitBounds(latLngs, { padding: [42, 42], maxZoom: 10 });
        setTimeout(() => map.invalidateSize(), 120);
        return () => { map.remove(); mapInstance.current = null; };
      }, [event?.event_id, track.map((row) => `${row.lat},${row.lon}`).join("|"), hasLeaflet]);
      if (!hasLeaflet) return <div className="note">互動地圖模組暫時無法載入，請使用上方軌跡節點。</div>;
      return <div ref={mapNode} className="leaflet-map" aria-label="72 小時反向漂流地圖"></div>;
    }

    function BayesianProbability({ event, rankings }) {
      const rows = bayesianRows(rankings);
      const top = rows[0];
      return <div className="grid"><section><h2>貝氏來源機率雛形</h2><p className="muted">目前事件：{event?.event_id}，{event?.station_name}</p><div className="summary-grid" style={{ marginTop: 12 }}><div className="metric"><span className="label">最高後驗來源</span><strong>{top?.source_name || "無資料"}</strong></div><div className="metric"><span className="label">後驗機率</span><strong>{number((top?.posterior || 0) * 100, 1)}%</strong></div><div className="metric"><span className="label">候選來源數</span><strong>{number(rows.length)}</strong></div><div className="metric"><span className="label">模型狀態</span><strong>規則式先驗 + 正規化似然</strong></div></div><div className="note" style={{ marginTop: 12 }}>此頁把目前來源分數轉為可檢核的後驗機率樣式。正式 Bayesian Network/MCMC 需加入歷史事件、排放量與連續觀測資料校正條件機率。</div></section><section><h2>模型節點</h2><div className="source-list"><div className="api-card"><h3>先驗</h3><p className="muted">來源類型、是否為正式放流口、河口/港區/工業活動。</p></div><div className="api-card"><h3>似然</h3><p className="muted">來源分數、污染物吻合、上游流向、上風方向、72 小時可達。</p></div><div className="api-card"><h3>後驗</h3><p className="muted">候選來源相對機率，用於排序與不確定度溝通。</p></div></div></section><section className="full"><h2>候選來源後驗機率</h2><div className="source-list">{rows.map((row, index) => <div className="source-card" key={`posterior-${row.source_id}`}><div className="source-head"><strong>{index + 1}. {row.source_name}</strong><span className={confidenceClass(row.confidence_level)}>{number(row.posterior * 100, 1)}%</span></div><div className="probability-bar"><span>後驗機率</span><div className="probability-track"><div className="probability-fill" style={{ width: `${Math.max(2, row.posterior * 100)}%` }}></div></div><strong>{number(row.posterior * 100, 1)}%</strong></div><div className="pill-row" style={{ marginTop: 10 }}><span className="pill">先驗權重 {number(row.prior, 2)}</span><span className="pill">來源分數 {number(row.source_score * 100, 1)}%</span><span className="pill">72 小時可達：{row.reachable_within_72h ? "是" : "否"}</span></div></div>)}</div></section></div>;
    }

    function SamplingPlanner({ event, rankings, sources }) {
      const plan = makeSamplingPlan(event, rankings, sources);
      return <div className="grid"><section><h2>下一採樣點推薦</h2><p className="muted">目前事件：{event?.event_id}，{event?.station_name}</p><div className="priority-list" style={{ marginTop: 12 }}>{plan.map((row, index) => <div className="priority-card" key={`${row.name}-${index}`}><div className="priority-rank">{index + 1}</div><div><h3>{row.name}</h3><p className="muted">{row.reason}</p><div className="pill-row"><span className="pill">緯度 {number(row.lat, 5)}</span><span className="pill">經度 {number(row.lon, 5)}</span></div></div></div>)}</div></section><section><h2>採樣策略</h2><div className="note">建議先做異常測站複測，再沿最高順位候選來源到事件測站的連線布設斷面點。這能同時驗證污染仍在、來源方向是否合理，以及 72 小時可達條件是否成立。</div><div className="source-list" style={{ marginTop: 12 }}><div className="api-card"><h3>現地項目</h3><p className="muted">溫度、鹽度、濁度、DO、pH、導電度、流速與流向。</p></div><div className="api-card"><h3>實驗室項目</h3><p className="muted">依事件污染群組加測葉綠素 a、SS、營養鹽或重金屬。</p></div></div></section><section className="full"><h2>採樣點地圖</h2><SamplingMap event={event} plan={plan} /></section></div>;
    }

    function SamplingMap({ event, plan }) {
      const mapNode = useRef(null);
      const mapInstance = useRef(null);
      const hasLeaflet = Boolean(globalThis.L);
      useEffect(() => {
        if (!mapNode.current || !hasLeaflet || !event || !plan.length) return;
        const L = globalThis.L;
        if (mapInstance.current) mapInstance.current.remove();
        const map = L.map(mapNode.current, { scrollWheelZoom: true, zoomControl: true }).setView([Number(event.lat), Number(event.lon)], 10);
        mapInstance.current = map;
        L.tileLayer(mapProvider.tileUrl, { maxZoom: 19, attribution: mapProvider.attribution }).addTo(map);
        const latLngs = plan.map((row) => [Number(row.lat), Number(row.lon)]);
        latLngs.forEach((latLng, index) => {
          const row = plan[index];
          L.circleMarker(latLng, { radius: index === 0 ? 8 : 7, color: "#ffffff", weight: 2, fillColor: index === 0 ? "#c84c4c" : "#006d77", fillOpacity: 0.95 }).bindPopup(`<strong>${index + 1}. ${row.name}</strong><br>${row.reason}`).addTo(map);
        });
        if (latLngs.length > 1) L.polyline(latLngs, { color: "#006d77", weight: 3, opacity: 0.65, dashArray: "6 8" }).addTo(map);
        if (latLngs.length > 1) map.fitBounds(latLngs, { padding: [42, 42], maxZoom: 12 });
        setTimeout(() => map.invalidateSize(), 120);
        return () => { map.remove(); mapInstance.current = null; };
      }, [event?.event_id, plan.map((row) => `${row.lat},${row.lon}`).join("|"), hasLeaflet]);
      if (!hasLeaflet) return <div className="note">互動地圖模組暫時無法載入，請使用上方經緯度清單進行採樣規劃。</div>;
      return <div ref={mapNode} className="mini-map" aria-label="下一採樣點推薦地圖"></div>;
    }

    function ConnectedMap({ event, rankings, sources, window }) {
      const mapNode = useRef(null);
      const mapInstance = useRef(null);
      const [tileCatalog, setTileCatalog] = useState([]);
      const [selectedTile, setSelectedTile] = useState("none");
      const rankedIds = new Set(rankings.map((row) => row.source_id));
      const points = sources.filter((source) => rankedIds.has(source.source_id) && Number(source.lon) && Number(source.lat));
      const topRows = new Map(rankings.map((row) => [row.source_id, row]));
      const hasLeaflet = Boolean(globalThis.L);
      const period = eventDateWindow(event);
      useEffect(() => {
        if (!event) return;
        const endpoints = ["GOCI", "OLNT_S3"].map((code) => ({ code, url: nodassUrl(code, period.start, period.end) }));
        Promise.all(endpoints.map((item) => fetch(item.url).then((res) => res.ok ? res.json() : []).then((rows) => ({ ...item, rows: Array.isArray(rows) ? rows : [] })).catch(() => ({ ...item, rows: [] }))))
          .then((items) => {
            const catalog = items.flatMap((item) => item.rows.slice(0, 3).map((row, index) => ({
              id: `${item.code}-${row.Id || row.DateTime || index}`,
              code: item.code,
              title: row.Title || `${item.code} ${row.DateTime || ""}`,
              datetime: row.DateTime || "無日期",
              template: tileTemplate(row.AccessURL)
            }))).filter((item) => item.template);
            setTileCatalog(catalog);
            setSelectedTile(catalog[0]?.id || "none");
          });
      }, [event?.event_id]);
      useEffect(() => {
        if (!mapNode.current || !hasLeaflet || !event) return;
        const L = globalThis.L;
        if (mapInstance.current) mapInstance.current.remove();
        const map = L.map(mapNode.current, { scrollWheelZoom: true, zoomControl: true }).setView([Number(event.lat), Number(event.lon)], 8);
        mapInstance.current = map;
        L.tileLayer(mapProvider.tileUrl, { maxZoom: 19, attribution: mapProvider.attribution }).addTo(map);
        const eventLayer = L.layerGroup().addTo(map);
        const sourceLayer = L.layerGroup().addTo(map);
        const routeLayer = L.layerGroup().addTo(map);
        const driftLayer = L.layerGroup().addTo(map);
        const selected = tileCatalog.find((item) => item.id === selectedTile);
        if (selected) L.tileLayer(selected.template, { opacity: 0.58, maxZoom: 19, attribution: "NODASS NAMR" }).addTo(map);
        const bounds = [];
        const eventLatLng = [Number(event.lat), Number(event.lon)];
        L.circleMarker(eventLatLng, { radius: 9, color: "#ffffff", weight: 2, fillColor: "#c84c4c", fillOpacity: 0.95 })
          .bindPopup(`<strong>${event.station_name}</strong><br>事件：${event.event_id}<br>污染物：${pollutantLabels[event.pollutant_name] || event.pollutant_name}<br>異常分數：${number(event.anomaly_score, 2)}`)
          .addTo(eventLayer);
        bounds.push(eventLatLng);
        points.forEach((point, index) => {
          const row = topRows.get(point.source_id);
          const latLng = [Number(point.lat), Number(point.lon)];
          const sourceColor = index === 0 ? "#d99a1e" : "#386fa4";
          L.polyline([latLng, eventLatLng], { color: "#2a9d8f", weight: index === 0 ? 4 : 2, opacity: index === 0 ? 0.75 : 0.4, dashArray: index === 0 ? null : "5 7" }).addTo(routeLayer);
          L.circleMarker(latLng, { radius: index === 0 ? 8 : 6, color: "#ffffff", weight: 2, fillColor: sourceColor, fillOpacity: 0.9 })
            .bindPopup(`<strong>${point.source_name}</strong><br>類型：${sourceTypeLabels[point.source_type] || point.source_type}<br>距離：${number(row?.distance_km, 2)} km<br>信心：${row?.confidence_level || "無資料"}<br>72 小時可達：${row?.reachable_within_72h ? "是" : "否"}`)
            .addTo(sourceLayer);
          bounds.push(latLng);
        });
        const drift = reverseDriftTrack(event, window);
        if (drift.length) {
          const latLngs = drift.map((row) => [row.lat, row.lon]);
          L.polyline(latLngs, { color: "#7b4ab8", weight: 4, opacity: 0.72, dashArray: "8 8" }).addTo(driftLayer);
          drift.forEach((row) => L.circleMarker([row.lat, row.lon], { radius: row.hour === 72 ? 7 : 4, color: "#ffffff", weight: 1.5, fillColor: "#7b4ab8", fillOpacity: 0.9 }).bindPopup(`<strong>反推 ${row.hour} 小時</strong><br>距離事件約 ${number(row.distanceKm, 2)} km`).addTo(driftLayer));
          latLngs.forEach((latLng) => bounds.push(latLng));
        }
        L.control.layers(null, { "異常測站": eventLayer, "候選來源": sourceLayer, "傳輸連線": routeLayer, "72 小時反向漂流": driftLayer }, { collapsed: false }).addTo(map);
        if (bounds.length > 1) map.fitBounds(bounds, { padding: [42, 42], maxZoom: 11 });
        setTimeout(() => map.invalidateSize(), 120);
        return () => { map.remove(); mapInstance.current = null; };
      }, [event?.event_id, rankings.map((row) => row.source_id).join("|"), hasLeaflet, selectedTile, tileCatalog.length]);
      if (!hasLeaflet) return <TaiwanMap event={event} rankings={rankings} sources={sources} window={window} />;
      return <div className="map-shell"><div className="map-tools"><p className="muted">底圖模組：{mapProvider.name}；可平移、縮放、點選事件與來源查看細節。</p><div className="map-legend"><span className="legend-item"><span className="legend-dot event"></span>異常測站</span><span className="legend-item"><span className="legend-dot source"></span>候選來源</span><span className="legend-item"><span className="legend-line"></span>傳輸連線</span><span className="legend-item"><span className="legend-line" style={{ background: "#7b4ab8" }}></span>反向漂流</span></div></div><div className="layer-panel"><div className="layer-row"><div><strong>NODASS 圖磚疊圖</strong><p className="muted">依目前事件 72 小時窗嘗試抓取 GOCI 與 OLNT_S3 圖磚。</p></div><select className="select-inline" value={selectedTile} onChange={(event) => setSelectedTile(event.target.value)}><option value="none">不疊加衛星圖磚</option>{tileCatalog.map((item) => <option key={item.id} value={item.id}>{item.code} · {item.datetime}</option>)}</select></div></div><div ref={mapNode} className="leaflet-map" aria-label="互動式污染來源追蹤地圖"></div></div>;
    }

    function TaiwanMap({ event, rankings, sources, window }) {
      const rankedIds = new Set(rankings.map((row) => row.source_id));
      const points = sources.filter((source) => rankedIds.has(source.source_id) && Number(source.lon) && Number(source.lat));
      const minLon = 118.0, maxLon = 123.2, minLat = 21.5, maxLat = 26.4;
      const x = (lon) => ((Number(lon) - minLon) / (maxLon - minLon)) * 100;
      const y = (lat) => 100 - ((Number(lat) - minLat) / (maxLat - minLat)) * 100;
      const eventX = event ? x(event.lon) : 50;
      const eventY = event ? y(event.lat) : 50;
      return <div className="map wide-map"><svg viewBox="0 0 100 100" role="img" aria-label="台灣周邊污染來源追蹤地圖" preserveAspectRatio="xMidYMid meet"><rect width="100" height="100" fill="#e8f5f7" /><path d="M55 3 C65 11 70 25 67 39 C64 54 61 65 58 81 C56 90 48 96 42 88 C35 78 34 63 36 49 C38 34 42 18 55 3 Z" fill="#d7e8d1" stroke="#789d77" strokeWidth="0.8" /><path d="M0 76 C20 70 35 72 55 80 C72 87 88 86 100 80" fill="none" stroke="#9cc8d0" strokeWidth="0.6" strokeDasharray="1.4 1.4" /><text x="58" y="28" className="map-label">台灣</text><text x="9" y="12" className="map-small">119°E</text><text x="82" y="12" className="map-small">123°E</text><text x="4" y="91" className="map-small">22°N</text><text x="4" y="10" className="map-small">26°N</text>{points.map((point, index) => <g key={point.source_id}><line x1={x(point.lon)} y1={y(point.lat)} x2={eventX} y2={eventY} stroke="#d99a1e" strokeWidth={index === 0 ? 0.8 : 0.35} opacity={index === 0 ? 0.8 : 0.45} /><circle className="map-point" cx={x(point.lon)} cy={y(point.lat)} r={index === 0 ? 2.3 : 1.7} fill="#d99a1e" stroke="#fff" strokeWidth="0.5"><title>{point.source_name}</title></circle></g>)}{event && <g><circle cx={eventX} cy={eventY} r="2.8" fill="#c84c4c" stroke="#fff" strokeWidth="0.8"><title>{event.station_name}</title></circle><text x={Math.min(84, eventX + 2.5)} y={Math.max(6, eventY - 2)} className="map-label">{event.station_name}</text></g>}<g transform={`translate(78 78) rotate(${window?.dominant_current_direction || 0})`}><line x1="0" y1="0" x2="10" y2="0" stroke="#2a9d8f" strokeWidth="1.2" /><path d="M10 0 L7 -2 L7 2 Z" fill="#2a9d8f" /></g><text x="70" y="87" className="map-small">主導流向</text></svg></div>;
    }

    function Consistency({ window }) {
      return <div className="grid"><section><h2>事件窗條件</h2><div className="summary-grid"><div className="metric"><span className="label">事件窗開始</span><strong>{window?.window_start || "無資料"}</strong></div><div className="metric"><span className="label">事件窗結束</span><strong>{window?.window_end || "無資料"}</strong></div><div className="metric"><span className="label">海氣象筆數</span><strong>{number(window?.meteo_rows)}</strong></div><div className="metric"><span className="label">潮差</span><strong>{number(window?.tide_range, 3)} m</strong></div><div className="metric"><span className="label">主導風向</span><strong>{number(window?.dominant_wind_direction, 1)}°</strong></div><div className="metric"><span className="label">主導流向</span><strong>{number(window?.dominant_current_direction, 1)}°</strong></div><div className="metric"><span className="label">平均流速</span><strong>{number(window?.mean_current_speed, 3)} m/s</strong></div><div className="metric"><span className="label">最近雨量站</span><strong>{window?.nearest_rain_station || "無資料"}</strong></div></div></section><section><h2>一致性規則</h2><div className="note">每個污染來源候選必須符合以下條件之一才會進入排序：事件前後 72 小時內依平均流速可達、來源位於上風方向、來源位於上游流向可達方向。未通過者直接排除。</div><div className="note" style={{ marginTop: 12 }}>雨量資料已接入最新觀測；若事件是歷史事件，系統會標示「時間不屬於此歷史事件窗」，不把即時雨量誤當成歷史佐證。</div></section></div>;
    }

    function MethodAssessment({ methods, apis }) {
      const highApis = apis.filter((api) => api.priority === "高");
      return <div className="grid"><section><h2>論文方法可復現功能</h2><div className="source-list">{methods.map((item) => <div className="source-card" key={item.method}><div className="source-head"><strong>{item.method}</strong><span className="badge">{item.score}</span></div><p className="muted">依據：{item.reference}</p><div className="progress"><span style={{ width: `${item.score}%` }}></span></div><p><strong>已放入系統：</strong>{item.reproduced_feature}</p><p><strong>目前支援：</strong>{item.current_support}</p><div className="note">{item.next_step}</div></div>)}</div></section><section><h2>已可操作的模型節點</h2><div className="source-list"><div className="api-card"><h3>事件節點</h3><p className="muted">污染物群組、異常分數、測站、時間、基準值。</p></div><div className="api-card"><h3>傳輸節點</h3><p className="muted">72 小時事件窗、平均流速、主導流向、主導風向、潮差。</p></div><div className="api-card"><h3>來源節點</h3><p className="muted">正式放流口、河口、港區、工業來源、距離與污染物吻合度。</p></div><div className="api-card"><h3>影像節點</h3><p className="muted">NODASS CHL/TSM/SST 影像端點探測，下一版可自動比對事件窗影像。</p></div></div></section><section className="full"><h2>優先接入的 NODASS API</h2><div className="api-grid">{highApis.slice(0, 10).map((api) => <div className="api-card" key={api.class_code}><h3>{api.class_code} · {api.name}</h3><p className="muted">{api.use_case}</p><a className="btn" href={api.endpoint} target="_blank" rel="noreferrer">查看 API</a></div>)}</div></section></div>;
    }

    function NodassProbe({ probe }) {
      const rows = probe.results || [];
      const readable = rows.filter((row) => row.status === "可讀取" || row.status === "可讀取但非 JSON").length;
      const imageRows = rows.filter((row) => row.url?.includes("/images/") || row.url?.includes("/tiles/"));
      const stationRows = rows.filter((row) => row.url?.includes("/obs/"));
      return <div className="grid"><section><h2>NODASS API 探測結果</h2><div className="summary-grid"><div className="metric"><span className="label">探測時間</span><strong>{probe.updated_at || "尚未探測"}</strong></div><div className="metric"><span className="label">探測端點</span><strong>{number(probe.total || rows.length)}</strong></div><div className="metric"><span className="label">可讀取</span><strong>{number(probe.readable || readable)}</strong></div><div className="metric"><span className="label">影像/圖磚端點</span><strong>{number(imageRows.length)}</strong></div></div><div className="note" style={{ marginTop: 12 }}>已可用的影像端點會回傳影像 URL、圖例 URL、日期與空間邊界；下一版可依異常事件日期自動抓取 ±72 小時影像清單。</div></section><section><h2>觀測站資料</h2><div className="source-list">{stationRows.map((row) => <div className="api-card" key={`${row.code}-${row.date1}-${row.status}`}><h3>{row.code} · {row.name}</h3><p className="muted">狀態：{row.status}，資料筆數：{number(row.record_count)}</p><a className="btn" href={row.url} target="_blank" rel="noreferrer">開啟 API</a></div>)}</div></section><section className="full"><h2>完整探測清單</h2><div className="table-wrap"><table><thead><tr><th>API</th><th>期間</th><th>狀態</th><th>HTTP</th><th>資料筆數</th><th>回傳欄位</th></tr></thead><tbody>{rows.map((row, index) => <tr key={`${row.url}-${index}`}><td>{row.code}</td><td>{row.date1 ? `${row.date1} ~ ${row.date2}` : "站點資料"}</td><td>{row.status}</td><td>{row.http_status || "無"}</td><td>{number(row.record_count)}</td><td>{(row.sample_keys || []).slice(0, 5).join("、")}</td></tr>)}</tbody></table></div></section></div>;
    }

    function OffshoreWindQuality({ summary }) {
      const datasets = summary.datasets || [];
      const items = summary.top_items || [];
      const sites = summary.top_sites || [];
      return <div className="grid"><section><h2>離岸風電海域水質</h2><p className="muted">{summary.message || "尚未匯入資料"}</p><div className="summary-grid" style={{ marginTop: 12 }}><div className="metric"><span className="label">資料表</span><strong>{number(summary.dataset_count)}</strong></div><div className="metric"><span className="label">監測紀錄</span><strong>{number(summary.record_count)}</strong></div><div className="metric"><span className="label">採樣地點</span><strong>{number(summary.sampling_site_count)}</strong></div><div className="metric"><span className="label">檢測項目</span><strong>{number(summary.item_count)}</strong></div></div><div className="note" style={{ marginTop: 12 }}>這批資料已作為環境部離岸風電水質 API 無法直接讀取時的離線佐證，可支援水質背景、採樣點分布與檢測項目盤點。</div></section><section><h2>主要檢測項目</h2><div className="bars">{items.map((item) => <div className="bar-row" key={item.name}><span>{item.name}</span><div className="track"><div className="fill" style={{ width: `${Math.max(6, item.count / Math.max(1, items[0]?.count || 1) * 100)}%` }}></div></div><span>{item.count}</span></div>)}</div></section><section><h2>採樣地點</h2><div className="source-list">{sites.map((site) => <div className="api-card" key={site.name}><h3>{site.name || "未命名地點"}</h3><p className="muted">紀錄數：{number(site.count)}</p></div>)}</div></section><section><h2>資料集摘要</h2><div className="table-wrap"><table><thead><tr><th>資料集</th><th>筆數</th><th>主要項目</th><th>主要地點</th></tr></thead><tbody>{datasets.map((item) => <tr key={item.dataset_name}><td>{item.dataset_name}</td><td>{number(item.record_count)}</td><td>{(item.top_items || []).map((row) => row.name).join("、")}</td><td>{(item.top_sites || []).map((row) => row.name).join("、")}</td></tr>)}</tbody></table></div></section></div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
